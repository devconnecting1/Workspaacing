name: Tauri Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts

      - name: Initialize Tauri Android
        working-directory: apps/mobile
        run: |
          rm -rf src-tauri/gen/android
          cargo tauri android init

      - name: Build Android APK
        working-directory: apps/mobile
        run: cargo tauri android build --target aarch64

      - name: Copy APK to root
        working-directory: apps/mobile
        run: |
          find src-tauri/gen/android -name "*.apk" -exec cp {} ../../app-release.apk \;
          ls -la ../../app-release.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspaacing-android
          path: app-release.apk
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
