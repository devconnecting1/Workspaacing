name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', '**/*.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Biome Check
        run: npx turbo run check

      - name: TypeScript Check
        run: npx turbo run typecheck

      - name: Knip (dead code)
        run: npx turbo run knip

      - name: Theme presets (drift check)
        run: |
          npm run generate:presets
          git diff --exit-code -- apps/web/src/lib/preferences/theme.ts || (echo "Theme drift detected! Run 'npm run generate:presets' and commit." && exit 1)

      - name: Build Next.js
        run: npx turbo run build --filter=@workspaacing/web

      - name: Type check Electron
        run: npx turbo run build --filter=@workspaacing/desktop
